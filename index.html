<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra Boda M&M</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f4efe7;
    font-family: Georgia, serif;
}

/* PORTADA */

#portada {
    position: fixed;
    inset: 0;
    z-index: 9999;

    background-image: url("portada.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    transition: opacity 1.2s ease;
}

/* CONTENEDOR DEL BOTÓN */

.contenido-portada {
    width: 100%;
    padding: 0 28px 7vh 28px;
    box-sizing: border-box;
    text-align: center;
}

/* BOTÓN */

button {
    width: 100%;
    max-width: 520px;

    background: rgba(105, 78, 54, 0.92);
    color: white;

    border: 1px solid rgba(255,255,255,0.65);

    padding: 17px 25px;

    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 3px;

    border-radius: 40px;

    box-shadow: 0 5px 18px rgba(0,0,0,0.18);

    cursor: pointer;
}

/* EFECTO AL TOCAR */

button:active {
    transform: scale(0.98);
}

/* INVITACIÓN */

#invitacion {
    display: none;
    width: 100%;
}

/* CONTENEDOR CANVA */

.canva {
    position: relative;
    width: 100%;
    height: 0;
    padding-top: 800%;
    overflow: hidden;
}

/* IFRAME CANVA */

.canva iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border: 0;
}

</style>
</head>

<body>

<!-- PORTADA -->

<div id="portada">

    <div class="contenido-portada">

        <button onclick="abrirInvitacion()">
            ♡ ABRIR INVITACIÓN ♡
        </button>

    </div>

</div>


<!-- MÚSICA -->

<audio id="musica" loop preload="auto">

    <source src="musica.mp3" type="audio/mpeg">

</audio>


<!-- INVITACIÓN CANVA -->

<div id="invitacion">

    <div class="canva">

        <iframe
            loading="lazy"
            src="https://www.canva.com/design/DAHUlSnWzjE/xYTh5v2Avh4tx_mNruaZbA/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen">
        </iframe>

    </div>

</div>


<script>

function abrirInvitacion() {

    const musica = document.getElementById("musica");
    const portada = document.getElementById("portada");
    const invitacion = document.getElementById("invitacion");

    musica.volume = 1;

    musica.play().catch(function(error) {
        console.log("Error al reproducir música:", error);
    });

    invitacion.style.display = "block";

    portada.style.opacity = "0";

    setTimeout(function() {
        portada.style.display = "none";
    }, 1200);

}

</script>

</body>
</html>
